name: Deploy Infrastructure (DEP-2C broken -- facilitator use only)

# Facilitator use only: this is the solution workflow with one deliberate
# error injected for Exercise DEP-2C. Copy the "Terraform Plan" step below
# into a running copy of the solution workflow (or trigger this file
# directly in a scratch branch) to reproduce the failure attendees debug.
#
# The injected error: the plan step references var.owner_name, which does
# not exist (the real variable is var.owner). This produces a clear
# "Reference to undeclared input variable" error in the job log for
# attendees to diagnose with Copilot Chat.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: modules/dep-track/module-01-iac-pipeline-as-code/exercises/terraform/solution

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (broken -- undeclared variable)
        run: terraform plan -var="owner_name=ci-runner"
